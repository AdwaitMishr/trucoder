<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="monospace">
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c1b18">The control plane</text>

  <rect x="20" y="60" width="120" height="44" rx="8" fill="#f4f3f0" stroke="#a8821b" stroke-width="2"/>
  <text x="80" y="87" text-anchor="middle" font-size="13" fill="#1c1b18">kubectl</text>

  <rect x="250" y="60" width="150" height="44" rx="8" fill="#fbfaf8" stroke="#1c1b18" stroke-width="2"/>
  <text x="325" y="87" text-anchor="middle" font-size="13" fill="#1c1b18">kube-apiserver</text>

  <line x1="140" y1="82" x2="250" y2="82" stroke="#8a867e" stroke-width="2"/>
  <polygon points="250,82 238,76 238,88" fill="#8a867e"/>

  <rect x="250" y="150" width="150" height="44" rx="8" fill="#fbfaf8" stroke="#1c1b18" stroke-width="2"/>
  <text x="325" y="177" text-anchor="middle" font-size="13" fill="#1c1b18">etcd</text>

  <rect x="430" y="60" width="180" height="44" rx="8" fill="#fbfaf8" stroke="#1c1b18" stroke-width="2"/>
  <text x="520" y="87" text-anchor="middle" font-size="13" fill="#1c1b18">kube-scheduler</text>

  <rect x="430" y="150" width="180" height="44" rx="8" fill="#fbfaf8" stroke="#1c1b18" stroke-width="2"/>
  <text x="520" y="177" text-anchor="middle" font-size="13" fill="#1c1b18">controller-manager</text>

  <line x1="325" y1="104" x2="325" y2="150" stroke="#8a867e" stroke-width="2"/>
  <line x1="400" y1="82" x2="430" y2="82" stroke="#8a867e" stroke-width="2"/>

  <rect x="20" y="280" width="180" height="44" rx="8" fill="#fbfaf8" stroke="#1c1b18" stroke-width="2"/>
  <text x="110" y="307" text-anchor="middle" font-size="13" fill="#1c1b18">worker: kubelet</text>
  <rect x="230" y="280" width="180" height="44" rx="8" fill="#fbfaf8" stroke="#1c1b18" stroke-width="2"/>
  <text x="320" y="307" text-anchor="middle" font-size="13" fill="#1c1b18">worker: kubelet</text>
  <rect x="440" y="280" width="180" height="44" rx="8" fill="#fbfaf8" stroke="#1c1b18" stroke-width="2"/>
  <text x="530" y="307" text-anchor="middle" font-size="13" fill="#1c1b18">worker: kubelet</text>

  <line x1="325" y1="194" x2="325" y2="280" stroke="#8a867e" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="325" y="222" text-anchor="middle" font-size="11" fill="#8a867e">API server talks to every kubelet</text>
