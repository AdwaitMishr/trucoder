name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The grading path is now network-based: the app container POSTs to
      # the sandbox daemons (sandbox:9000 / sandbox-node:9001). CI builds
      # the real stack and verifies inside it — same code path as prod.
      - name: Build stack images (app + sandbox daemons)
        run: |
          touch .env
          docker compose build

      - name: Start sandbox daemons
        run: |
          export DOCKER_GID=$(getent group docker | cut -d: -f3)
          docker compose up -d sandbox sandbox-node

      - name: Verify every tracked lesson's solution vs its tests
        run: |
          export DOCKER_GID=$(getent group docker | cut -d: -f3)
          docker compose run --rm app node server/scripts/verify.js

      - name: Lint course content (callout syntax + asset references)
        run: |
          export DOCKER_GID=$(getent group docker | cut -d: -f3)
          docker compose run --rm app node server/scripts/lint-courses.js
