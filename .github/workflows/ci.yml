name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build sandbox image (for grading)
        run: docker build -t trucoder-sandbox:latest sandbox-image/

      - name: Build node module-runner sandbox image (for module exercises)
        run: docker build -t trucoder-sandbox-node:latest sandbox-image-node/

      - name: Server — deps + typecheck
        run: |
          cd server
          npm ci
          npm run build

      - name: Web — deps + typecheck + build
        run: |
          cd web
          npm ci
          npm run build

      - name: Verify every tracked lesson's solution vs its tests
        run: |
          cd server
          node scripts/verify.js

      - name: Lint course content (callout syntax + asset references)
        run: |
          cd server
          node scripts/lint-courses.js
