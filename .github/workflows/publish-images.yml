name: publish-images

# Builds and publishes multi-arch (linux/amd64 + linux/arm64) images to GHCR
# on every push to main: app, sandbox, sandbox-node. The Pi (arm64) can
# then pull prebuilt images instead of building from source.
#
# NOTE: the compose file keeps local image names (trucoder-app:latest etc.)
# with `build:` contexts, so the default flow is build-from-source. The
# published images are the convenience path — see the README.

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/trucoder-app:latest
            ghcr.io/${{ github.repository_owner }}/trucoder-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish sandbox image
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox-image
          file: sandbox-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/trucoder-sandbox:latest
            ghcr.io/${{ github.repository_owner }}/trucoder-sandbox:${{ github.sha }}
          # Inline cache rides inside the pushed image instead of the 10GB gha
          # pool, which every publish run saturates (3 images x 2 arch,
          # mode=max -> the previous run's layers are evicted before the next
          # run can use them). The sandbox Dockerfile is single-stage, so its
          # apt/download layers all live in the final image — the next build
          # pulls the cache from :latest and skips the emulated apt install.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/trucoder-sandbox:latest
          cache-to: type=inline

      - name: Publish node sandbox image
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox-image-node
          file: sandbox-image-node/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/trucoder-sandbox-node:latest
            ghcr.io/${{ github.repository_owner }}/trucoder-sandbox-node:${{ github.sha }}
          # Same inline-cache scheme as the main sandbox image (single-stage
          # Dockerfile, apk + npm layers all in the final image).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/trucoder-sandbox-node:latest
          cache-to: type=inline
