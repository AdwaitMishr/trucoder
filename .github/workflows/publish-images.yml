name: publish-images

# Builds and publishes multi-arch (linux/amd64 + linux/arm64) images to GHCR
# on every push to main: app, sandbox, sandbox-node. The Pi (arm64) can
# then pull prebuilt images instead of building from source.
#
# NOTE: the compose file keeps local image names (trucoder-app:latest etc.)
# with `build:` contexts, so the default flow is build-from-source. The
# published images are the convenience path — see the README.

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push: true is NOT the action default — without it (as shipped until
      # 2026-08) every run built into the ephemeral buildx cache and
      # discarded the result; nothing was ever published to GHCR.
      #
      # Cache: registry backend on a dedicated :cache tag. The gha pool is
      # too small (each run writes ~5GB of layers, evicting the previous
      # run's cache before it can be used) and inline cache does not carry
      # multi-stage build stages. The :cache tag persists in the registry
      # (public repo -> free storage) and serves both platforms and all
      # build stages — after the first run, apt/npm-ci layers are reused and
      # only tsc + the vite build re-run.
      - name: Publish app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/trucoder-app:latest
            ghcr.io/${{ github.repository_owner }}/trucoder-app:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/trucoder-app:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/trucoder-app:cache,mode=max

      - name: Publish sandbox image
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox-image
          file: sandbox-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trucoder-sandbox:latest
            ghcr.io/${{ github.repository_owner }}/trucoder-sandbox:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/trucoder-sandbox:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/trucoder-sandbox:cache,mode=max

      - name: Publish node sandbox image
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox-image-node
          file: sandbox-image-node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trucoder-sandbox-node:latest
            ghcr.io/${{ github.repository_owner }}/trucoder-sandbox-node:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/trucoder-sandbox-node:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/trucoder-sandbox-node:cache,mode=max
